<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4C55D4">
<meta name="description" content="קורס רוסית מדוברת בעברית — מילים, הבנה ודיבור, עם הקראה בקול.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מדברים רוסית">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>מדברים רוסית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;800&family=Heebo:wght@400;500;700&family=PT+Serif:wght@400;700&display=swap">
<style>
  :root {
    font-size: 17px;

    --bg: #F4F6FB;
    --bg-2: #E8ECF7;
    --surface: #FFFFFF;
    --surface-2: #F1F4FA;
    --ink: #1B2334;
    --ink-soft: #39445C;
    --muted: #5E6980;
    --line: #DFE4EF;

    --brand: hsl(248 62% 55%);
    --brand-ink: hsl(248 62% 42%);
    --brand-bg: hsl(248 80% 96%);
    --brand-on: #FFFFFF;

    --good: hsl(152 58% 34%);
    --good-bg: hsl(152 60% 92%);
    --good-line: hsl(152 45% 62%);
    --bad: hsl(352 62% 45%);
    --bad-bg: hsl(352 80% 95%);
    --bad-line: hsl(352 60% 72%);
    --star: hsl(42 92% 48%);

    --c: hsl(var(--h, 248) 58% 42%);
    --c-strong: hsl(var(--h, 248) 62% 50%);
    --c-bg: hsl(var(--h, 248) 80% 95%);
    --c-line: hsl(var(--h, 248) 60% 82%);
    --c-on: #FFFFFF;

    --shadow: 0 1px 2px rgba(27,35,52,.05), 0 6px 18px rgba(27,35,52,.07);
    --shadow-lift: 0 3px 6px rgba(27,35,52,.08), 0 16px 36px rgba(27,35,52,.14);

    --r-s: 12px;
    --r-m: 18px;
    --r-l: 26px;
    --tap: 52px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121721;
      --bg-2: #0C1018;
      --surface: #1B2230;
      --surface-2: #232C3D;
      --ink: #EDF0F7;
      --ink-soft: #CBD3E2;
      --muted: #9AA5BA;
      --line: #303B4F;

      --brand: hsl(248 78% 72%);
      --brand-ink: hsl(248 85% 80%);
      --brand-bg: hsl(248 40% 22%);
      --brand-on: #12131F;

      --good: hsl(152 55% 62%);
      --good-bg: hsl(152 35% 18%);
      --good-line: hsl(152 40% 40%);
      --bad: hsl(352 75% 74%);
      --bad-bg: hsl(352 35% 20%);
      --bad-line: hsl(352 45% 45%);
      --star: hsl(42 90% 62%);

      --c: hsl(var(--h, 248) 75% 72%);
      --c-strong: hsl(var(--h, 248) 70% 64%);
      --c-bg: hsl(var(--h, 248) 38% 20%);
      --c-line: hsl(var(--h, 248) 40% 38%);
      --c-on: #12131F;

      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.4);
      --shadow-lift: 0 3px 8px rgba(0,0,0,.45), 0 16px 36px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121721;
    --bg-2: #0C1018;
    --surface: #1B2230;
    --surface-2: #232C3D;
    --ink: #EDF0F7;
    --ink-soft: #CBD3E2;
    --muted: #9AA5BA;
    --line: #303B4F;
    --brand: hsl(248 78% 72%);
    --brand-ink: hsl(248 85% 80%);
    --brand-bg: hsl(248 40% 22%);
    --brand-on: #12131F;
    --good: hsl(152 55% 62%);
    --good-bg: hsl(152 35% 18%);
    --good-line: hsl(152 40% 40%);
    --bad: hsl(352 75% 74%);
    --bad-bg: hsl(352 35% 20%);
    --bad-line: hsl(352 45% 45%);
    --star: hsl(42 90% 62%);
    --c: hsl(var(--h, 248) 75% 72%);
    --c-strong: hsl(var(--h, 248) 70% 64%);
    --c-bg: hsl(var(--h, 248) 38% 20%);
    --c-line: hsl(var(--h, 248) 40% 38%);
    --c-on: #12131F;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.4);
    --shadow-lift: 0 3px 8px rgba(0,0,0,.45), 0 16px 36px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; }

  html, body { max-width: 100%; overflow-x: hidden; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Heebo", "Segoe UI", system-ui, sans-serif;
    font-size: 1rem;
    line-height: 1.6;
    direction: rtl;
    overflow-wrap: anywhere;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .ru { font-family: "PT Serif", Georgia, serif; direction: ltr; unicode-bidi: isolate; }

  h1, h2, h3 {
    font-family: "Rubik", "Heebo", system-ui, sans-serif;
    font-weight: 800;
    margin: 0;
    text-wrap: balance;
    letter-spacing: -.015em;
    line-height: 1.2;
  }
  h1 { font-size: 1.8rem; }
  h2 { font-size: 1.3rem; }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; border-radius: 6px; }

  .shell { max-width: 900px; margin: 0 auto; padding: 0 14px 96px; }

  /* ---------------- top bar ---------------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 900px; margin: 0 auto;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-family: "Rubik", sans-serif; font-weight: 800; font-size: 1.1rem;
  }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 11px;
    background: var(--brand); color: var(--brand-on);
    display: grid; place-items: center;
    font-family: "PT Serif", serif; font-size: 1.15rem; line-height: 1;
  }
  .topbar .spacer { flex: 1; }
  .mini {
    display: flex; align-items: center; gap: 8px;
    font-size: .8rem; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .mini-bar { width: 70px; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .mini-bar i { display: block; height: 100%; background: var(--brand); border-radius: 99px; transition: width .45s ease; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 13px;
    display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--line);
    font-size: 1.1rem; flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); }

  /* ---------------- settings ---------------- */
  .settings {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-m); box-shadow: var(--shadow);
    padding: 16px; margin: 14px auto 0; max-width: 900px;
    display: none; flex-direction: column; gap: 16px;
  }
  .settings.open { display: flex; }
  .set-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .set-row > .lbl { min-width: 128px; font-weight: 500; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 10px 16px; border-radius: 99px;
    border: 2px solid var(--line); background: var(--surface);
    font-weight: 500; min-height: 46px;
  }
  .chip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-bg); color: var(--brand-ink); font-weight: 700; }

  /* ---------------- buttons ---------------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    min-height: var(--tap); padding: 12px 22px;
    border-radius: 14px; border: 2px solid var(--line);
    background: var(--surface); font-weight: 600;
    transition: transform .12s ease, box-shadow .18s ease, background .18s ease;
  }
  .btn:hover { box-shadow: var(--shadow); }
  .btn:active { transform: translateY(2px); }
  .btn-brand { background: var(--brand); border-color: var(--brand); color: var(--brand-on); }
  .btn-c { background: var(--c-strong); border-color: var(--c-strong); color: var(--c-on); }
  .btn-soft { background: var(--c-bg); border-color: var(--c-line); color: var(--c); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 10px 14px; }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); box-shadow: none; }
  .btn-lg { font-size: 1.1rem; min-height: 60px; border-radius: 18px; }

  /* ---------------- home ---------------- */
  .hero {
    margin: 18px 0 22px; padding: 22px;
    border-radius: var(--r-l);
    background: linear-gradient(135deg, hsl(248 62% 55%), hsl(282 58% 52%));
    color: #FFFFFF;
    box-shadow: var(--shadow-lift);
    display: flex; flex-direction: column; gap: 14px;
  }
  .hero h1 { color: #FFFFFF; font-size: 1.75rem; }
  .hero p { margin: 0; color: rgba(255,255,255,.92); max-width: 46ch; }
  .hero-bar { height: 12px; border-radius: 99px; background: rgba(255,255,255,.28); overflow: hidden; }
  .hero-bar i { display: block; height: 100%; border-radius: 99px; background: #FFFFFF; transition: width .5s ease; }
  .hero-stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: .9rem; color: rgba(255,255,255,.92); }
  .hero-stats b { font-size: 1.2rem; display: block; font-family: "Rubik", sans-serif; font-variant-numeric: tabular-nums; }
  .hero .btn { border: none; }
  .hero-cta { background: #FFFFFF; color: hsl(248 62% 42%); font-weight: 800; }

  .section-head { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; flex-wrap: wrap; }
  .section-head .hint { color: var(--muted); font-size: .85rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }

  .lesson {
    --shadow-c: color-mix(in srgb, var(--c-strong) 22%, transparent);
    text-align: start; padding: 16px;
    border-radius: var(--r-m);
    background: var(--surface);
    border: 2px solid var(--line);
    display: flex; flex-direction: column; gap: 12px;
    transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .lesson:hover { transform: translateY(-3px); border-color: var(--c-line); box-shadow: var(--shadow-lift); }
  .lesson-top { display: flex; align-items: center; gap: 12px; }
  .emoji {
    width: 52px; height: 52px; border-radius: 16px; flex: none;
    display: grid; place-items: center; font-size: 1.6rem;
    background: var(--c-bg); border: 1px solid var(--c-line);
  }
  .lesson-name { display: block; font-family: "Rubik", sans-serif; font-weight: 700; font-size: 1.05rem; line-height: 1.3; }
  .lesson-sub { display: block; font-size: .84rem; color: var(--muted); line-height: 1.4; }
  .lesson-top > span:last-child { min-width: 0; }
  .lesson-blurb { font-size: .9rem; color: var(--ink-soft); }
  .bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
  .bar i { display: block; height: 100%; background: var(--c-strong); border-radius: 99px; transition: width .45s ease; }
  .done-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: .8rem; font-weight: 700; color: var(--good);
    background: var(--good-bg); border-radius: 99px; padding: 2px 10px;
  }

  /* ---------------- lesson screen ---------------- */
  .crumbs { display: flex; align-items: center; gap: 6px; margin: 12px 0; }
  .head-card {
    border-radius: var(--r-l); padding: 20px;
    background: var(--c-bg); border: 2px solid var(--c-line);
    display: flex; align-items: center; gap: 16px;
  }
  .head-card .emoji { width: 64px; height: 64px; font-size: 2rem; background: var(--surface); }
  .head-card h1 { color: var(--c); font-size: 1.5rem; }
  .head-card p { margin: 4px 0 0; color: var(--ink-soft); font-size: .92rem; }

  .restore { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .restore p { margin: 0; font-size: .9rem; color: var(--muted); }
  .restore textarea {
    width: 100%; padding: 10px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--surface-2); color: var(--ink); font: .8rem/1.4 monospace; resize: vertical;
  }
  .backup-msg { width: 100%; margin: 0; font-size: .9rem; min-height: 1.3em; }
  .backup-msg.ok { color: var(--good); } .backup-msg.bad { color: var(--bad); }
  .mic {
    width: 96px; height: 96px; border-radius: 99px; display: grid; place-items: center;
    background: var(--c-strong); color: var(--c-on); box-shadow: var(--shadow-lift);
    transition: transform .15s ease;
  }
  .mic svg { width: 42px; height: 42px; }
  .mic:hover { transform: scale(1.05); }
  .mic:active { transform: scale(.95); }
  .mic.on { background: var(--bad); animation: pulse 1.1s ease-in-out infinite; }
  .speak.big { width: auto; height: 46px; padding: 0 18px; gap: 8px; display: inline-flex; align-items: center; font-weight: 600; }
  .feedback.listen { background: var(--c-bg); color: var(--c); border-color: var(--c-line); justify-content: center; }
  .feedback small { font-size: .85rem; opacity: .85; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--bad) 50%, transparent); } 50% { box-shadow: 0 0 0 18px transparent; } }
  .mode-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 16px 0 26px; }
  .mode {
    text-align: start; padding: 18px; border-radius: var(--r-m);
    border: 2px solid var(--line); background: var(--surface);
    display: flex; align-items: center; gap: 14px;
    transition: transform .15s ease, box-shadow .2s ease, border-color .2s;
  }
  .mode:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: var(--c-line); }
  .mode .ic { font-size: 1.8rem; }
  .mode strong { display: block; font-family: "Rubik", sans-serif; font-size: 1.05rem; }
  .mode span { font-size: .85rem; color: var(--muted); }

  .steps { display: flex; flex-direction: column; gap: 10px; }
  .step {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px; border-radius: var(--r-m);
    background: var(--surface); border: 2px solid var(--line);
  }
  .step-done { border-style: dashed; border-color: var(--good-line); background: var(--good-bg); }
  .step-num {
    width: 42px; height: 42px; border-radius: 14px; flex: none;
    display: grid; place-items: center;
    font-family: "Rubik", sans-serif; font-weight: 800; font-size: 1.1rem;
    background: var(--c-bg); color: var(--c); border: 1px solid var(--c-line);
  }
  .step-body { flex: 1 1 190px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .step-body > b { font-family: "Rubik", sans-serif; font-size: 1rem; }
  .step-words { font-size: .85rem; color: var(--muted); line-height: 1.45; }
  .step-pill {
    align-self: flex-start; margin-top: 4px;
    font-size: .78rem; font-weight: 700; color: var(--c);
    background: var(--c-bg); border-radius: 99px; padding: 2px 10px;
  }
  .step .btn { flex: 0 0 auto; }
  @media (max-width: 460px) { .step .btn { flex: 1 1 100%; } }

  .word-list { display: flex; flex-direction: column; gap: 8px; }
  .word-row {
    display: grid;
    grid-template-columns: 12px minmax(0, 1fr) auto;
    align-items: center; gap: 2px 12px;
    padding: 12px 14px; border-radius: var(--r-s);
    background: var(--surface); border: 1px solid var(--line);
  }
  .word-row .status { grid-column: 1; grid-row: 1; }
  .word-row .he { grid-column: 2; grid-row: 1; min-width: 0; }
  .word-row .he b { font-weight: 600; font-size: 1.02rem; }
  .word-row .he small { display: block; color: var(--muted); font-size: .82rem; line-height: 1.4; }
  .word-row .tr { grid-column: 2; grid-row: 2; min-width: 0; color: var(--c); font-size: .95rem; font-weight: 500; }
  .word-row .tr .cy { display: block; font-size: .78rem; color: var(--muted); font-weight: 400; }
  .word-row .speak { grid-column: 3; grid-row: 1 / span 2; }
  .status { width: 12px; height: 12px; border-radius: 99px; background: var(--line); flex: none; }
  .status.learning { background: var(--star); }
  .status.known { background: var(--good); }

  .speak {
    flex: none; width: 50px; height: 50px; border-radius: 16px;
    display: grid; place-items: center;
    background: var(--c-bg); color: var(--c); border: 1px solid var(--c-line);
    transition: transform .12s ease, background .15s ease;
  }
  .speak:hover { background: var(--c-strong); color: var(--c-on); }
  .speak:active { transform: scale(.93); }
  .speak.playing { background: var(--c-strong); color: var(--c-on); }
  .speak svg { width: 24px; height: 24px; }

  /* ---------------- cards / stage ---------------- */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .counter { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }

  .card {
    width: 100%; max-width: 560px; min-height: 320px;
    border-radius: var(--r-l); padding: 28px 20px;
    background: var(--surface); border: 2px solid var(--c-line);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center;
  }
  .translit {
    font-family: "Rubik", sans-serif; font-weight: 600;
    font-size: clamp(1.4rem, 7vw, 2rem);
    color: var(--c); background: var(--c-bg);
    padding: 6px 18px; border-radius: 99px;
    line-height: 1.35;
  }
  .meaning { font-family: "Rubik", sans-serif; font-weight: 800; font-size: clamp(1.5rem, 7vw, 2.1rem); }
  .cyr { font-family: "PT Serif", Georgia, serif; font-size: 1.1rem; color: var(--muted); direction: ltr; }
  .note { font-size: .9rem; color: var(--muted); max-width: 38ch; margin: 0; }
  .veil { color: var(--muted); font-size: .95rem; margin: 0; }

  .big-speak {
    width: 104px; height: 104px; border-radius: 99px;
    display: grid; place-items: center;
    background: var(--c-strong); color: var(--c-on);
    box-shadow: var(--shadow-lift);
    transition: transform .15s ease;
  }
  .big-speak:hover { transform: scale(1.05); }
  .big-speak:active { transform: scale(.95); }
  .big-speak svg { width: 44px; height: 44px; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; max-width: 560px; }
  .row .btn { flex: 1; min-width: 140px; }

  /* ---------------- quiz ---------------- */
  .quiz-head { width: 100%; max-width: 600px; display: flex; align-items: center; gap: 12px; }
  .quiz-head .bar { flex: 1; }
  .hearts { font-size: .9rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .prompt { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .ask { color: var(--muted); font-size: .92rem; margin: 0; }
  .he-word { font-family: "Rubik", sans-serif; font-weight: 800; font-size: clamp(1.6rem, 8vw, 2.3rem); }

  .options { width: 100%; max-width: 600px; display: grid; gap: 10px; }
  .opt {
    text-align: start; padding: 15px 18px; min-height: var(--tap);
    border-radius: var(--r-m); border: 2px solid var(--line);
    background: var(--surface); font-size: 1.08rem; font-weight: 500;
    display: flex; align-items: center; gap: 12px;
    transition: transform .12s ease, border-color .15s ease, background .15s ease;
  }
  .opt .num {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    display: grid; place-items: center; font-size: .85rem; font-weight: 700;
    background: var(--surface-2); color: var(--muted);
  }
  .opt:hover:not(:disabled) { border-color: var(--c-strong); transform: translateX(-4px); }
  .opt:disabled { cursor: default; }
  .opt .cy { display: block; font-size: .82rem; color: var(--muted); }
  .opt.correct { background: var(--good-bg); border-color: var(--good-line); color: var(--good); font-weight: 700; }
  .opt.correct .num, .opt.wrong .num { background: transparent; font-size: 1.2rem; color: inherit; }
  .opt.correct .cy, .opt.wrong .cy { color: inherit; opacity: .8; }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }

  .feedback {
    width: 100%; max-width: 600px;
    border-radius: var(--r-m); padding: 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    font-size: 1rem; border: 2px solid transparent;
  }
  .feedback.ok { background: var(--good-bg); color: var(--good); border-color: var(--good-line); }
  .feedback.no { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-line); }
  .feedback .txt { flex: 1; min-width: 180px; }
  .feedback .txt b { font-weight: 800; }
  .feedback .btn { border-color: currentColor; background: transparent; color: inherit; }

  /* ---------------- result ---------------- */
  .result {
    width: 100%; max-width: 560px; text-align: center;

const FINALS = { "ך": "כ", "ם": "מ", "ן": "נ", "ף": "פ", "ץ": "צ" };
function heGender(text, fem) {
  return text.replace(/([א-ת]+)\/([א-ת]+)/g, (m, a, b) => {
    const suffix = b.length <= 1;
    if (!fem) return a;
    return suffix ? a.slice(0, -1) + (FINALS[a.slice(-1)] || a.slice(-1)) + b : b;
  });
}
function applyGender() {

    w.tr = f ? w.g.tr : w.tr0;
    w.he = f ? w.g.he : heGender(w.he0, fem);
  }));
}

const PACK_FIELDS = ["score", "right", "wrong", "seen", "said", "last"];
function packProgress(p) {
  return Object.keys(p).filter(id => ALL.some(w => w.id === id)).map(id => {
    const e = p[id];
    return id + "=" + PACK_FIELDS.map(f => f === "seen" ? (e.seen ? 1 : 0) : (Number(e[f]) || 0)).join(",");
  }).join(";");
}
function unpackProgress(str) {
  const out = {};
  String(str).split(";").forEach(part => {
    const i = part.indexOf("=");
    if (i < 1) return;
    const id = part.slice(0, i), v = part.slice(i + 1).split(",").map(Number);
    if (!ALL.some(w => w.id === id) || v.length < 4 || v.some(x => !Number.isFinite(x))) return;
    const e = {};
    PACK_FIELDS.forEach((f, k) => { if (f === "seen") { if (v[k]) e.seen = true; } else e[f] = v[k] || 0; });
    out[id] = e;
  });
  return out;
}
function makeBackup() {
  let days = []; try { days = JSON.parse(localStorage.getItem("ru-days") || "[]"); } catch (e) {}
  return "RU1:" + btoa(JSON.stringify({ v: 1, p: packProgress(progress), f: prefs, d: days }));
}
function parseBackup(text) {
  const t = String(text).trim();
  if (!t.startsWith("RU1:")) throw new Error("format");
  let data;
  try { data = JSON.parse(atob(t.slice(4).replace(/\s+/g, ""))); } catch (e) { throw new Error("corrupt"); }
  if (!data || data.v !== 1 || typeof data.p !== "string") throw new Error("corrupt");
  const p = unpackProgress(data.p);
  const f = data.f && typeof data.f === "object" ? data.f : {}, safe = {};
  if ([17, 20, 23].includes(f.size)) safe.size = f.size;
  if ([0.6, 0.8, 1].includes(f.rate)) safe.rate = f.rate;
  if ([0, 1].includes(f.cyr)) safe.cyr = f.cyr;
  if (f.gender === "f" || f.gender === "m") safe.gender = f.gender;
  return { progress: p, prefs: safe, days: Array.isArray(data.d) ? data.d.filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x)) : [] };
}

function speak(text, btn) {

/* ---- מקבצים: לומדים 5 מילים, ומיד נבחנים עליהן ---- */
const CHUNK = 5;
function chunksOf(c) {
  const out = [];
  for (let i = 0; i < c.words.length; i += CHUNK) out.push(c.words.slice(i, i + CHUNK));
  if (out.length > 1 && out[out.length - 1].length < 4) {
    const last = out.pop();
    out[out.length - 1] = out[out.length - 1].concat(last);
  }
  return out;
}
const isSeen = id => !!(progress[id] && progress[id].seen);
const taught = ws => ws.filter(w => isSeen(w.id));
function markSeen(id) {
  const p = progress[id] || (progress[id] = { score: 0, right: 0, wrong: 0 });
  if (!p.seen) { p.seen = true; saveProgress(); }
}
function nextStep() {
  for (const c of CATS) {
    const chunks = chunksOf(c);
    for (let i = 0; i < chunks.length; i++) if (taught(chunks[i]).length < chunks[i].length) return { c, ci: i, chunks };
  }
  return null;
}

function uniq(ws) { const seen = {}; return ws.filter(w => (seen[w.id] ? false : (seen[w.id] = true))); }

function buildQuestions(listenWords, recallWords, pool) {
  const src = listenWords.map(w => ({ w: w, type: "listen" }))
    .concat(recallWords.map(w => ({ w: w, type: "recall" })));
  return shuffle(src).map(q => {
    const clash = x => x.id === q.w.id || x.he === q.w.he || x.tr === q.w.tr;
    let others = shuffle(pool.filter(x => !clash(x))).slice(0, 3);
    if (others.length < 3) {
      const same = ALL.filter(x => !clash(x) && !others.some(o => o.id === x.id) && !others.some(o => o.he === x.he));
      others = others.concat(shuffle(same).slice(0, 3 - others.length));
    }
    return { word: q.w, type: q.type, options: shuffle([q.w].concat(others)) };
  });
}
const emptyQuiz = extra => Object.assign({ i: 0, right: 0, answered: null, wrongList: [] }, extra);

function quizForChunk(catId, ci) {
  const c = catById(catId), list = chunksOf(c)[ci];
  const pool = uniq(list.concat(taught(c.words)));
  return emptyQuiz({
    kind: "chunk", catId: catId, ci: ci, h: c.h,
    label: "תרגול על " + list.length + " המילים שלמדת עכשיו",
    qs: buildQuestions(list, shuffle(list).slice(0, 3), pool)
  });
}
function quizForReview(catId) {
  const c = catById(catId), t = taught(c.words);
  const picks = shuffle(t).slice(0, 10);
  const pool = t.length >= 4 ? t : c.words;
  return emptyQuiz({
    kind: "review", catId: catId, h: c.h, label: "חזרה על מה שלמדת בשיעור",
    qs: buildQuestions(picks.slice(0, 7), picks.slice(7, 10), pool)
  });
}
function quizQuick() {
  const t = taught(ALL);
  const weak = t.filter(w => scoreOf(w.id) < MASTER_AT);
  const picks = uniq(shuffle(weak).slice(0, 7).concat(shuffle(t))).slice(0, 10);
  return emptyQuiz({
    kind: "quick", catId: "mix", h: 248, label: "תרגול על מילים שכבר למדת",
    qs: buildQuestions(picks.slice(0, 7), picks.slice(7, 10), t)
  });
}

/* =======================  דיבור: זיהוי הגייה במיקרופון  ======================= */
let SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;

function normRu(s) {
  return String(s).toLowerCase().replace(/ё/g, "е").replace(/[^а-я0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}
function editDistance(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = []; for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
// מילים קצרות (עד 3 אותיות) חייבות להיות מדויקות; ארוכות מקבלות סטייה של עד רבע מהאורך.
// ביטוי שנגמר ב"…" (למשל "קוראים לי…") מתקבל גם כשממשיכים אחריו בשם.
function spokenOk(expected, heard) {
  const e = normRu(expected);
  if (!e) return false;
  const open = /…|\.\.\./.test(expected);
  return heard.some(h => {
    const n = normRu(h);
    if (!n) return false;
    if (n === e) return true;
    if (open && n.startsWith(e)) return true;
    if (e.length <= 3) return false;
    return editDistance(n, e) / Math.max(n.length, e.length) <= 0.25;
  });
}

function listenOnce(done) {
  const rec = new SR();
  rec.lang = "ru-RU"; rec.maxAlternatives = 5; rec.interimResults = false; rec.continuous = false;
  let finished = false;
  const finish = r => { if (!finished) { finished = true; done(r); } };
  rec.onresult = e => finish({ alts: [...e.results[0]].map(a => a.transcript) });
  rec.onerror = e => finish({ error: e.error || "unknown" });
  rec.onend = () => finish({ error: "no-speech" });
  try { rec.start(); } catch (err) { finish({ error: "busy" }); }
  return rec;
}

        : '<p class="note">אמרת את כל המילים נכון.</p>') +
      '<div class="row"><button class="btn btn-lg btn-c" data-speak-again="1">עוד סיבוב 🔁</button>' +
      '<button class="btn btn-lg" data-go="cat" data-cat="' + c.id + '">חזרה לשיעור</button></div>' +
    '</div></div>';
    return;
  }
  const w = s.list[s.i], listening = s.status === "listening";
  let fb = "";
  if (listening) fb = '<div class="feedback listen">מקשיבה… אמרי עכשיו</div>';
  else if (s.status === "ok") fb = '<div class="feedback ok"><span class="txt">✓ מעולה, זה נשמע נכון</span></div>';
  else if (s.status === "miss") fb = '<div class="feedback no"><span class="txt">לא בדיוק. הקשיבי שוב ונסי עוד פעם' +
      (prefs.cyr && s.heard ? '<br><small>שמעתי: <span class="ru">' + esc(s.heard) + '</span></small>' : '') + '</span></div>';
  else if (s.err) fb = '<div class="feedback no"><span class="txt">' + esc(MIC_ERRORS[s.err] || "משהו השתבש, נסי שוב.") + '</span></div>';

  app.innerHTML = back +
    '<div class="stage" style="--h:' + c.h + '">' +
      '<span class="counter">תרגול דיבור · מילה ' + (s.i + 1) + ' מתוך ' + s.list.length + '</span>' +
      (SR ? "" : '<div class="notice"><span>🎤</span><div><b>הדפדפן הזה לא מזהה דיבור</b>ב-Chrome באנדרואיד זה עובד. בינתיים אפשר לתרגל לבד: להקשיב, לומר בקול, ולסמן "אמרתי".</div></div>') +
      '<div class="card">' +
        '<div class="meaning">' + esc(w.he) + '</div>' +
        '<div class="translit">' + esc(w.tr) + '</div>' +
        '<button class="speak big" data-say="' + esc(w.ru) + '" aria-label="השמע">' + ICON + ' <span>להקשיב</span></button>' +
        (SR
          ? '<button class="mic' + (listening ? " on" : "") + '" data-sp="mic" aria-label="לדבר"' + (listening ? " disabled" : "") + '>' + MIC + '</button>' +
            '<p class="veil">' + (listening ? "מקשיבה…" : "לחצי על המיקרופון ואמרי את המילה") + '</p>'
          : '<button class="btn btn-lg btn-c" data-sp="self">אמרתי בקול ✓</button>') +
      '</div>' +
      '<div id="fb" aria-live="polite">' + fb + '</div>' +
      '<div class="row">' +
        (s.status === "ok"
          ? '<button class="btn btn-lg btn-c" data-sp="next">' + (s.i === s.list.length - 1 ? "לסיכום" : "הבאה ←") + '</button>'
          : '<button class="btn btn-ghost" data-sp="next">' + (s.attempts >= 2 ? "לא נורא, הבאה ←" : "דלגי ←") + '</button>') +
      '</div>' +
    '</div>';
  if (!s.played) { s.played = true; setTimeout(() => speak(w.ru), 250); }
}

function doListen() {
  const s = state.speak;
  if (!SR || s.status === "listening") return;
  const w = s.list[s.i];
  try { speechSynthesis.cancel(); } catch (e) {}
  s.status = "listening"; s.err = ""; render();
  setTimeout(() => {
    state.rec = listenOnce(res => {
      state.rec = null;
      if (state.screen !== "speak" || state.speak !== s || s.list[s.i] !== w) return;
      if (res.error) { s.status = "idle"; s.err = res.error; }
      else {
        s.attempts++; s.heard = res.alts[0] || "";
        if (spokenOk(w.ru, res.alts)) { s.status = "ok"; s.ok++; const p = progress[w.id] || (progress[w.id] = { score: 0, right: 0, wrong: 0 }); p.said = (p.said || 0) + 1; saveProgress(); }
        else s.status = "miss";
      }
      render();
    });
  }, 350);
}

function nextSpeak() {
  const s = state.speak, w = s.list[s.i];
  if (s.status !== "ok") s.missed.push(w);
  if (s.i === s.list.length - 1) s.done = true;
  else { s.i++; s.status = "idle"; s.heard = ""; s.attempts = 0; s.err = ""; s.played = false; }
  render();
}

function render() {
  renderMini();
  ({ home: screenHome, cat: screenCat, learn: screenLearn, quiz: screenQuiz, result: screenResult, speak: screenSpeak }[state.screen])();
}

/* =======================  אירועים  ======================= */
document.addEventListener("click", e => {
  const say = e.target.closest("[data-say]");
  if (say) { speak(say.dataset.say, say); return; }

  const nav = e.target.closest("[data-go]");
  if (nav) {
    const to = nav.dataset.go, cat = nav.dataset.cat;
    if (to === "home") go("home", { catId: null });
    else if (to === "cat") go("cat", { catId: cat });
    return;
  }

  const sp = e.target.closest("[data-speak]");
  if (sp) {
    const parts = sp.dataset.speak.split(":"), c = catById(parts[0]);
    go("speak", { catId: c.id, speakChunk: +parts[1], speak: newSpeak(taught(chunksOf(c)[+parts[1]]).length ? taught(chunksOf(c)[+parts[1]]) : chunksOf(c)[+parts[1]]) });
    return;
  }
  if (e.target.closest("[data-speak-again]")) {
    const c = catById(state.catId), list = chunksOf(c)[state.speakChunk];
    go("speak", { speak: newSpeak(list) });
    return;
  }
  const spa = e.target.closest("[data-sp]");
  if (spa) {
    const act = spa.dataset.sp;
    if (act === "mic") doListen();
    else if (act === "next") nextSpeak();
    else if (act === "self") { const s = state.speak; if (s.status !== "ok") { s.status = "ok"; s.ok++; } render(); }
    return;
  }

  const st = e.target.closest("[data-start]");
  if (st) {
    const parts = st.dataset.start.split(":"), c = catById(parts[0]), ci = +parts[1];
    go("learn", { catId: c.id, ci: ci, chunkWords: chunksOf(c)[ci], idx: 0, flipped: false });
    return;
  }

  const qz = e.target.closest("[data-quiz]");
  if (qz) {
    const p = qz.dataset.quiz.split(":");
    if (p[0] === "quick") go("quiz", { quiz: quizQuick() });
    else if (p[0] === "review") go("quiz", { quiz: quizForReview(p[1]) });
    else if (p[0] === "chunk") go("quiz", { quiz: quizForChunk(p[1], +p[2]) });
    return;
  }

  const ans = e.target.closest("[data-ans]");
  if (ans) { answer(ans.dataset.ans); return; }

  if (e.target.closest("[data-next]")) {
    const q = state.quiz;
    if (q.i === q.qs.length - 1) go("result");
    else { q.i++; q.answered = null; render(); }
    return;
  }

  const lb = e.target.closest("[data-learn]");
  if (lb) {
    const list = state.chunkWords, w = list[state.idx], act = lb.dataset.learn;
    const advance = () => {
      if (state.idx === list.length - 1) go("quiz", { quiz: quizForChunk(state.catId, state.ci) });
      else { state.idx++; state.flipped = false; render(); }
    };
    if (act === "flip") { state.flipped = true; render(); }
    else if (act === "known" || act === "again") { setKnown(w.id, act === "known"); advance(); }
    else if (act === "next") advance();
    else if (act === "prev" && state.idx > 0) { state.idx--; state.flipped = false; render(); }
    return;
  }

  if (e.target.closest("[data-install]")) {
    if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(() => { deferredPrompt = null; }); }
    else alert("בכרום באנדרואיד:\n\n1. לוחצים על שלוש הנקודות ⋮ למעלה\n2. בוחרים \"הוספה למסך הבית\"\n3. מאשרים \"התקנה\"\n\nבאייפון (ספארי):\n1. לוחצים על כפתור השיתוף למטה\n2. בוחרים \"הוסף למסך הבית\"");
    return;
  }

  const chip = e.target.closest(".chip");
  if (chip) {
    if (chip.dataset.size) prefs.size = +chip.dataset.size;
    if (chip.dataset.rate) { prefs.rate = +chip.dataset.rate; speak("Привет"); }
    if (chip.dataset.cyr) { prefs.cyr = +chip.dataset.cyr; render(); }
    if (chip.dataset.gender) { prefs.gender = chip.dataset.gender; applyGender(); render(); }
    savePrefs();
  }
});

document.getElementById("setBtn").addEventListener("click", e => {
  const panel = document.getElementById("settings");
  const open = panel.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", String(open));
});
document.getElementById("backupBtn").addEventListener("click", async () => {
  const code = makeBackup();
  try { await navigator.clipboard.writeText(code); backupMsg("הקוד הועתק. אפשר לשלוח אותו לעצמך בוואטסאפ ולשמור.", "ok"); }
  catch (e) {
    const pane = document.getElementById("restorePane"), box = document.getElementById("restoreBox");
    pane.hidden = false; box.value = code; box.select();
    backupMsg("לא הצלחתי להעתיק אוטומטית. הקוד מופיע בתיבה למטה: לסמן הכול, להעתיק ולשמור.", "bad");
  }
});
document.getElementById("restoreBtn").addEventListener("click", () => {
  const pane = document.getElementById("restorePane");
  pane.hidden = !pane.hidden;
  if (!pane.hidden) document.getElementById("restoreBox").focus();
});
document.getElementById("restoreGo").addEventListener("click", () => {
  let data;
  try { data = parseBackup(document.getElementById("restoreBox").value); }
  catch (e) { backupMsg(e.message === "format" ? "זה לא נראה כמו קוד גיבוי. הוא מתחיל ב-RU1:" : "הקוד פגום או נחתך באמצע ההעתקה. נסי להעתיק אותו שוב במלואו.", "bad"); return; }
  const n = Object.keys(data.progress).length;
  if (!confirm("לשחזר " + n + " מילים? זה יחליף את ההתקדמות שיש כרגע במכשיר הזה.")) return;
  progress = data.progress;
  Object.assign(prefs, data.prefs);
  try { localStorage.setItem("ru-days", JSON.stringify(data.days)); } catch (e) {}
  savePrefs(); applyGender(); saveProgress(); render();
  document.getElementById("restoreBox").value = ""; document.getElementById("restorePane").hidden = true;
  backupMsg("שוחזרו " + n + " מילים.", "ok");
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("לאפס את כל ההתקדמות ולהתחיל מחדש?")) return;
  progress = {};
  saveProgress();
  render();
});

document.addEventListener("keydown", e => {
  if (state.screen === "learn") {
    if (e.key === " ") { e.preventDefault(); if (!state.flipped) { state.flipped = true; render(); } }
    if (e.key === "ArrowLeft") document.querySelector('[data-learn="next"]')?.click();
    if (e.key === "ArrowRight") document.querySelector('[data-learn="prev"]')?.click();
  }
  if (state.screen === "quiz" && /^[1-4]$/.test(e.key)) document.querySelectorAll(".opt")[+e.key - 1]?.click();
  if (e.key === "Enter") document.querySelector("[data-next]")?.click();
});

/* =======================  התקנה + אופליין  ======================= */
let deferredPrompt = null;
const bar = document.getElementById("installBar");
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e;
  if (!localStorage.getItem("ru-install-dismissed")) bar.classList.add("show");
});
document.getElementById("installBtn").addEventListener("click", async () => {
  bar.classList.remove("show");
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null;
});
document.getElementById("installNo").addEventListener("click", () => {
  bar.classList.remove("show");
  try { localStorage.setItem("ru-install-dismissed", "1"); } catch (e) {}
});
window.addEventListener("appinstalled", () => bar.classList.remove("show"));
// רענון אוטומטי כשגרסה חדשה משתלטת. התנאי hadController קריטי:
// בביקור הראשון אין controller, וריענון שם היה יוצר לולאה.
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloaded) return;
    reloaded = true;
    location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(reg => reg.update().catch(() => {}))
      .catch(() => {});
  });
}

applyPrefs();
render();
</script>
