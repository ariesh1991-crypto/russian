<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4C55D4">
<meta name="description" content="קורס רוסית מדוברת בעברית — מילים, הבנה ודיבור, עם הקראה בקול.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מדברים רוסית">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>מדברים רוסית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;800&family=Heebo:wght@400;500;700&family=PT+Serif:wght@400;700&display=swap">
<style>
  :root {
    font-size: 17px;

    --bg: #F4F6FB;
    --bg-2: #E8ECF7;
    --surface: #FFFFFF;
    --surface-2: #F1F4FA;
    --ink: #1B2334;
    --ink-soft: #39445C;
    --muted: #5E6980;
    --line: #DFE4EF;

    --brand: hsl(248 62% 55%);
    --brand-ink: hsl(248 62% 42%);
    --brand-bg: hsl(248 80% 96%);
    --brand-on: #FFFFFF;

    --good: hsl(152 58% 34%);
    --good-bg: hsl(152 60% 92%);
    --good-line: hsl(152 45% 62%);
    --bad: hsl(352 62% 45%);
    --bad-bg: hsl(352 80% 95%);
    --bad-line: hsl(352 60% 72%);
    --star: hsl(42 92% 48%);

    --c: hsl(var(--h, 248) 58% 42%);
    --c-strong: hsl(var(--h, 248) 62% 50%);
    --c-bg: hsl(var(--h, 248) 80% 95%);
    --c-line: hsl(var(--h, 248) 60% 82%);
    --c-on: #FFFFFF;

    --shadow: 0 1px 2px rgba(27,35,52,.05), 0 6px 18px rgba(27,35,52,.07);
    --shadow-lift: 0 3px 6px rgba(27,35,52,.08), 0 16px 36px rgba(27,35,52,.14);

    --r-s: 12px;
    --r-m: 18px;
    --r-l: 26px;
    --tap: 52px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12172180;
      --bg: #121721;
      --bg-2: #0C1018;
      --surface: #1B2230;
      --surface-2: #232C3D;
      --ink: #EDF0F7;
      --ink-soft: #CBD3E2;
      --muted: #9AA5BA;
      --line: #303B4F;

      --brand: hsl(248 78% 72%);
      --brand-ink: hsl(248 85% 80%);
      --brand-bg: hsl(248 40% 22%);
      --brand-on: #12131F;

      --good: hsl(152 55% 62%);
      --good-bg: hsl(152 35% 18%);
      --good-line: hsl(152 40% 40%);
      --bad: hsl(352 75% 74%);
      --bad-bg: hsl(352 35% 20%);
      --bad-line: hsl(352 45% 45%);
      --star: hsl(42 90% 62%);

      --c: hsl(var(--h, 248) 75% 72%);
      --c-strong: hsl(var(--h, 248) 70% 64%);
      --c-bg: hsl(var(--h, 248) 38% 20%);
      --c-line: hsl(var(--h, 248) 40% 38%);
      --c-on: #12131F;

      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.4);
      --shadow-lift: 0 3px 8px rgba(0,0,0,.45), 0 16px 36px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121721;
    --bg-2: #0C1018;
    --surface: #1B2230;
    --surface-2: #232C3D;
    --ink: #EDF0F7;
    --ink-soft: #CBD3E2;
    --muted: #9AA5BA;
    --line: #303B4F;
    --brand: hsl(248 78% 72%);
    --brand-ink: hsl(248 85% 80%);
    --brand-bg: hsl(248 40% 22%);
    --brand-on: #12131F;
    --good: hsl(152 55% 62%);
    --good-bg: hsl(152 35% 18%);
    --good-line: hsl(152 40% 40%);
    --bad: hsl(352 75% 74%);
    --bad-bg: hsl(352 35% 20%);
    --bad-line: hsl(352 45% 45%);
    --star: hsl(42 90% 62%);
    --c: hsl(var(--h, 248) 75% 72%);
    --c-strong: hsl(var(--h, 248) 70% 64%);
    --c-bg: hsl(var(--h, 248) 38% 20%);
    --c-line: hsl(var(--h, 248) 40% 38%);
    --c-on: #12131F;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.4);
    --shadow-lift: 0 3px 8px rgba(0,0,0,.45), 0 16px 36px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; }

  html, body { max-width: 100%; overflow-x: hidden; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Heebo", "Segoe UI", system-ui, sans-serif;
    font-size: 1rem;
    line-height: 1.6;
    direction: rtl;
    overflow-wrap: anywhere;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .ru { font-family: "PT Serif", Georgia, serif; direction: ltr; unicode-bidi: isolate; }

  h1, h2, h3 {
    font-family: "Rubik", "Heebo", system-ui, sans-serif;
    font-weight: 800;
    margin: 0;
    text-wrap: balance;
    letter-spacing: -.015em;
    line-height: 1.2;
  }
  h1 { font-size: 1.8rem; }
  h2 { font-size: 1.3rem; }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; border-radius: 6px; }

  .shell { max-width: 900px; margin: 0 auto; padding: 0 14px 96px; }

  /* ---------------- top bar ---------------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 900px; margin: 0 auto;
    padding: 10px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-family: "Rubik", sans-serif; font-weight: 800; font-size: 1.1rem;
  }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 11px;
    background: var(--brand); color: var(--brand-on);
    display: grid; place-items: center;
    font-family: "PT Serif", serif; font-size: 1.15rem; line-height: 1;
  }
  .topbar .spacer { flex: 1; }
  .mini {
    display: flex; align-items: center; gap: 8px;
    font-size: .8rem; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .mini-bar { width: 70px; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .mini-bar i { display: block; height: 100%; background: var(--brand); border-radius: 99px; transition: width .45s ease; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 13px;
    display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--line);
    font-size: 1.1rem; flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); }

  /* ---------------- settings ---------------- */
  .settings {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-m); box-shadow: var(--shadow);
    padding: 16px; margin: 14px auto 0; max-width: 900px;
    display: none; flex-direction: column; gap: 16px;
  }
  .settings.open { display: flex; }
  .set-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .set-row > .lbl { min-width: 128px; font-weight: 500; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 10px 16px; border-radius: 99px;
    border: 2px solid var(--line); background: var(--surface);
    font-weight: 500; min-height: 46px;
  }
  .chip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-bg); color: var(--brand-ink); font-weight: 700; }

  /* ---------------- buttons ---------------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    min-height: var(--tap); padding: 12px 22px;
    border-radius: 14px; border: 2px solid var(--line);
    background: var(--surface); font-weight: 600;
    transition: transform .12s ease, box-shadow .18s ease, background .18s ease;
  }
  .btn:hover { box-shadow: var(--shadow); }
  .btn:active { transform: translateY(2px); }
  .btn-brand { background: var(--brand); border-color: var(--brand); color: var(--brand-on); }
  .btn-c { background: var(--c-strong); border-color: var(--c-strong); color: var(--c-on); }
  .btn-soft { background: var(--c-bg); border-color: var(--c-line); color: var(--c); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 10px 14px; }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); box-shadow: none; }
  .btn-lg { font-size: 1.1rem; min-height: 60px; border-radius: 18px; }

  /* ---------------- home ---------------- */
  .hero {
    margin: 18px 0 22px; padding: 22px;
    border-radius: var(--r-l);
    background: linear-gradient(135deg, hsl(248 62% 55%), hsl(282 58% 52%));
    color: #FFFFFF;
    box-shadow: var(--shadow-lift);
    display: flex; flex-direction: column; gap: 14px;
  }
  .hero h1 { color: #FFFFFF; font-size: 1.75rem; }
  .hero p { margin: 0; color: rgba(255,255,255,.92); max-width: 46ch; }
  .hero-bar { height: 12px; border-radius: 99px; background: rgba(255,255,255,.28); overflow: hidden; }
  .hero-bar i { display: block; height: 100%; border-radius: 99px; background: #FFFFFF; transition: width .5s ease; }
  .hero-stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: .9rem; color: rgba(255,255,255,.92); }
  .hero-stats b { font-size: 1.2rem; display: block; font-family: "Rubik", sans-serif; font-variant-numeric: tabular-nums; }
  .hero .btn { border: none; }
  .hero-cta { background: #FFFFFF; color: hsl(248 62% 42%); font-weight: 800; }

  .section-head { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; flex-wrap: wrap; }
  .section-head .hint { color: var(--muted); font-size: .85rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }

  .lesson {
    --shadow-c: color-mix(in srgb, var(--c-strong) 22%, transparent);
    text-align: start; padding: 16px;
    border-radius: var(--r-m);
    background: var(--surface);
    border: 2px solid var(--line);
    display: flex; flex-direction: column; gap: 12px;
    transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .lesson:hover { transform: translateY(-3px); border-color: var(--c-line); box-shadow: var(--shadow-lift); }
  .lesson-top { display: flex; align-items: center; gap: 12px; }
  .emoji {
    width: 52px; height: 52px; border-radius: 16px; flex: none;
    display: grid; place-items: center; font-size: 1.6rem;
    background: var(--c-bg); border: 1px solid var(--c-line);
  }
  .lesson-name { font-family: "Rubik", sans-serif; font-weight: 700; font-size: 1.05rem; }
  .lesson-sub { font-size: .84rem; color: var(--muted); }
  .lesson-blurb { font-size: .9rem; color: var(--ink-soft); }
  .bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
  .bar i { display: block; height: 100%; background: var(--c-strong); border-radius: 99px; transition: width .45s ease; }
  .done-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: .8rem; font-weight: 700; color: var(--good);
    background: var(--good-bg); border-radius: 99px; padding: 2px 10px;
  }

  /* ---------------- lesson screen ---------------- */
  .crumbs { display: flex; align-items: center; gap: 6px; margin: 12px 0; }
  .head-card {
    border-radius: var(--r-l); padding: 20px;
    background: var(--c-bg); border: 2px solid var(--c-line);
    display: flex; align-items: center; gap: 16px;
  }
  .head-card .emoji { width: 64px; height: 64px; font-size: 2rem; background: var(--surface); }
  .head-card h1 { color: var(--c); font-size: 1.5rem; }
  .head-card p { margin: 4px 0 0; color: var(--ink-soft); font-size: .92rem; }

  .mode-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 16px 0 26px; }
  .mode {
    text-align: start; padding: 18px; border-radius: var(--r-m);
    border: 2px solid var(--line); background: var(--surface);
    display: flex; align-items: center; gap: 14px;
    transition: transform .15s ease, box-shadow .2s ease, border-color .2s;
  }
  .mode:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: var(--c-line); }
  .mode .ic { font-size: 1.8rem; }
  .mode strong { display: block; font-family: "Rubik", sans-serif; font-size: 1.05rem; }
  .mode span { font-size: .85rem; color: var(--muted); }

  .word-list { display: flex; flex-direction: column; gap: 8px; }
  .word-row {
    display: grid;
    grid-template-columns: 12px minmax(0, 1fr) auto;
    align-items: center; gap: 2px 12px;
    padding: 12px 14px; border-radius: var(--r-s);
    background: var(--surface); border: 1px solid var(--line);
  }
  .word-row .status { grid-column: 1; grid-row: 1; }
  .word-row .he { grid-column: 2; grid-row: 1; min-width: 0; }
  .word-row .he b { font-weight: 600; font-size: 1.02rem; }
  .word-row .he small { display: block; color: var(--muted); font-size: .82rem; line-height: 1.4; }
  .word-row .tr { grid-column: 2; grid-row: 2; min-width: 0; color: var(--c); font-size: .95rem; font-weight: 500; }
  .word-row .tr .cy { display: block; font-size: .78rem; color: var(--muted); font-weight: 400; }
  .word-row .speak { grid-column: 3; grid-row: 1 / span 2; }
  .status { width: 12px; height: 12px; border-radius: 99px; background: var(--line); flex: none; }
  .status.learning { background: var(--star); }
  .status.known { background: var(--good); }

  .speak {
    flex: none; width: 50px; height: 50px; border-radius: 16px;
    display: grid; place-items: center;
    background: var(--c-bg); color: var(--c); border: 1px solid var(--c-line);
    transition: transform .12s ease, background .15s ease;
  }
  .speak:hover { background: var(--c-strong); color: var(--c-on); }
  .speak:active { transform: scale(.93); }
  .speak.playing { background: var(--c-strong); color: var(--c-on); }
  .speak svg { width: 24px; height: 24px; }

  /* ---------------- cards / stage ---------------- */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .counter { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }

  .card {
    width: 100%; max-width: 560px; min-height: 320px;
    border-radius: var(--r-l); padding: 28px 20px;
    background: var(--surface); border: 2px solid var(--c-line);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center;
  }
  .translit {
    font-family: "Rubik", sans-serif; font-weight: 600;
    font-size: clamp(1.4rem, 7vw, 2rem);
    color: var(--c); background: var(--c-bg);
    padding: 6px 18px; border-radius: 99px;
    line-height: 1.35;
  }
  .meaning { font-family: "Rubik", sans-serif; font-weight: 800; font-size: clamp(1.5rem, 7vw, 2.1rem); }
  .cyr { font-family: "PT Serif", Georgia, serif; font-size: 1.1rem; color: var(--muted); direction: ltr; }
  .note { font-size: .9rem; color: var(--muted); max-width: 38ch; margin: 0; }
  .veil { color: var(--muted); font-size: .95rem; margin: 0; }

  .big-speak {
    width: 104px; height: 104px; border-radius: 99px;
    display: grid; place-items: center;
    background: var(--c-strong); color: var(--c-on);
    box-shadow: var(--shadow-lift);
    transition: transform .15s ease;
  }
  .big-speak:hover { transform: scale(1.05); }
  .big-speak:active { transform: scale(.95); }
  .big-speak svg { width: 44px; height: 44px; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; max-width: 560px; }
  .row .btn { flex: 1; min-width: 140px; }

  /* ---------------- quiz ---------------- */
  .quiz-head { width: 100%; max-width: 600px; display: flex; align-items: center; gap: 12px; }
  .quiz-head .bar { flex: 1; }
  .hearts { font-size: .9rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .prompt { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .ask { color: var(--muted); font-size: .92rem; margin: 0; }
  .he-word { font-family: "Rubik", sans-serif; font-weight: 800; font-size: clamp(1.6rem, 8vw, 2.3rem); }

  .options { width: 100%; max-width: 600px; display: grid; gap: 10px; }
  .opt {
    text-align: start; padding: 15px 18px; min-height: var(--tap);
    border-radius: var(--r-m); border: 2px solid var(--line);
    background: var(--surface); font-size: 1.08rem; font-weight: 500;
    display: flex; align-items: center; gap: 12px;
    transition: transform .12s ease, border-color .15s ease, background .15s ease;
  }
  .opt .num {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    display: grid; place-items: center; font-size: .85rem; font-weight: 700;
    background: var(--surface-2); color: var(--muted);
  }
  .opt:hover:not(:disabled) { border-color: var(--c-strong); transform: translateX(-4px); }
  .opt:disabled { cursor: default; }
  .opt .cy { display: block; font-size: .82rem; color: var(--muted); }
  .opt.correct { background: var(--good-bg); border-color: var(--good-line); color: var(--good); font-weight: 700; }
  .opt.correct .num, .opt.wrong .num { background: transparent; font-size: 1.2rem; color: inherit; }
  .opt.correct .cy, .opt.wrong .cy { color: inherit; opacity: .8; }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }

  .feedback {
    width: 100%; max-width: 600px;
    border-radius: var(--r-m); padding: 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    font-size: 1rem; border: 2px solid transparent;
  }
  .feedback.ok { background: var(--good-bg); color: var(--good); border-color: var(--good-line); }
  .feedback.no { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-line); }
  .feedback .txt { flex: 1; min-width: 180px; }
  .feedback .txt b { font-weight: 800; }
  .feedback .btn { border-color: currentColor; background: transparent; color: inherit; }

  /* ---------------- result ---------------- */
  .result {
    width: 100%; max-width: 560px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    padding: 28px 22px; border-radius: var(--r-l);
    background: var(--surface); border: 2px solid var(--line); box-shadow: var(--shadow);
  }
  .stars { font-size: 2.4rem; letter-spacing: 6px; color: var(--star); }
  .score { font-family: "Rubik", sans-serif; font-weight: 800; font-size: 3.2rem; line-height: 1; color: var(--c); font-variant-numeric: tabular-nums; }
  .review { width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: start; }
  .r-row { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--r-s); background: var(--surface-2); font-size: .95rem; }
  .r-row .g { color: var(--muted); }

  .notice {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 14px; border-radius: var(--r-m); margin: 14px 0;
    background: hsl(42 90% 94%); color: hsl(32 80% 28%);
    border: 1px solid hsl(42 80% 76%); font-size: .9rem;
  }
  :root[data-theme="dark"] .notice { background: hsl(42 40% 18%); color: hsl(42 85% 78%); border-color: hsl(42 40% 34%); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .notice { background: hsl(42 40% 18%); color: hsl(42 85% 78%); border-color: hsl(42 40% 34%); }
  }
  .notice b { display: block; }
  .foot { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 30px; }

  .install-bar {
    position: fixed; inset-inline: 12px; bottom: 12px; z-index: 40;
    display: none; align-items: center; gap: 12px;
    padding: 14px; border-radius: var(--r-m);
    background: var(--surface); border: 2px solid var(--brand);
    box-shadow: var(--shadow-lift); max-width: 540px; margin: 0 auto;
  }
  .install-bar.show { display: flex; }
  .install-bar .t { flex: 1; font-size: .9rem; }
  .install-bar .t b { display: block; font-family: "Rubik", sans-serif; }

  @media (max-width: 540px) {
    h1 { font-size: 1.55rem; }
    .shell { padding: 0 12px 90px; }
    .grid { grid-template-columns: 1fr; }
    .card { padding: 22px 14px; min-height: 280px; }
    .hero { padding: 18px; }
    .row .btn { min-width: 0; flex: 1 1 100%; }
    .mode-row { grid-template-columns: 1fr; }
    .set-row > .lbl { min-width: 100%; }
  }
  @media (max-width: 400px) {
    .brand .label { display: none; }
    .topbar-inner { gap: 8px; padding: 10px 12px; }
  }

  .install-card {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 16px; border-radius: var(--r-m); margin-top: 18px;
    background: var(--brand-bg); border: 2px dashed var(--brand);
  }

CATS.forEach(c => c.words.forEach((w, i) => { w.id = c.id + "-" + i; w.cat = c.id; }));
const ALL = CATS.flatMap(c => c.words);
const TOTAL = ALL.length;
const MASTER_AT = 3;

/* =======================  מצב  ======================= */
let progress = {};
let prefs = { size: 17, rate: 0.8, cyr: 1 };
const state = { screen: "home", catId: null, idx: 0, flipped: false, quiz: null };

try { progress = JSON.parse(localStorage.getItem("ru-progress") || "{}") || {}; } catch (e) { progress = {}; }
try { Object.assign(prefs, JSON.parse(localStorage.getItem("ru-prefs") || "{}")); } catch (e) {}

const scoreOf = id => (progress[id] && progress[id].score) || 0;
const levelOf = id => { const s = scoreOf(id); return s >= MASTER_AT ? "known" : s > 0 ? "learning" : ""; };
const mastered = ws => ws.filter(w => scoreOf(w.id) >= MASTER_AT).length;
const started = ws => ws.filter(w => scoreOf(w.id) > 0).length;

function saveProgress() {
  try { localStorage.setItem("ru-progress", JSON.stringify(progress)); } catch (e) {}
  renderMini();
}
function savePrefs() {
  try { localStorage.setItem("ru-prefs", JSON.stringify(prefs)); } catch (e) {}
  applyPrefs();
}
function applyPrefs() {
  document.documentElement.style.fontSize = prefs.size + "px";
  document.querySelectorAll("#sizeChips .chip").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.size === +prefs.size)));
  document.querySelectorAll("#rateChips .chip").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.rate === +prefs.rate)));
  document.querySelectorAll("#cyrChips .chip").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.cyr === +prefs.cyr)));
}
function bump(id, right) {
  const p = progress[id] || (progress[id] = { score: 0, right: 0, wrong: 0 });
  if (right) { p.score = Math.min(5, p.score + 1); p.right++; }
  else { p.score = Math.max(0, p.score - 1); p.wrong++; }
  saveProgress();
}
function setKnown(id, known) {
  const p = progress[id] || (progress[id] = { score: 0, right: 0, wrong: 0 });
  p.score = known ? MASTER_AT : 1;
  saveProgress();
}

/* =======================  דיבור  ======================= */
let ruVoice = null, voicesChecked = false;
function loadVoices() {
  if (!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  voicesChecked = true;
  ruVoice = vs.find(v => (v.lang || "").toLowerCase().replace("_", "-").startsWith("ru")) || null;
  const el = document.getElementById("voiceNotice");
  if (el) el.innerHTML = voiceNoticeHTML();
}
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices, 1000); }
function voiceNoticeHTML() {
  if (!voicesChecked || ruVoice) return "";
  return '<div class="notice"><span>🔈</span><div><b>עדיין אין קול רוסי במכשיר</b>' +
    'ההקראה תעבוד, אבל ההגייה לא תהיה מדויקת. באנדרואיד: הגדרות ← שפה וקלט ← פלט טקסט לדיבור ← מנוע Google ← התקנת נתוני קול ← Русский.</div></div>';
}
function speak(text, btn) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ru-RU";
  if (ruVoice) u.voice = ruVoice;
  u.rate = prefs.rate;
  if (btn) {
    btn.classList.add("playing");
    const off = () => btn.classList.remove("playing");
    u.onend = off; u.onerror = off; setTimeout(off, 5000);
  }
  speechSynthesis.speak(u);
}

/* =======================  עזרים  ======================= */
const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; };
const catById = id => CATS.find(c => c.id === id);
const app = document.getElementById("app");
const cyr = w => prefs.cyr ? '<span class="cy ru">' + esc(w.ru) + '</span>' : "";

function go(screen, patch) { Object.assign(state, patch || {}, { screen }); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

/* =======================  מסכים  ======================= */
function renderMini() {
  const done = mastered(ALL), pct = Math.round(done / TOTAL * 100);
  document.getElementById("mini").innerHTML =
    '<span>' + done + '/' + TOTAL + '</span><span class="mini-bar"><i style="width:' + pct + '%"></i></span>';
}

function screenHome() {
  const done = mastered(ALL), inWork = started(ALL), pct = Math.round(done / TOTAL * 100);
  const next = CATS.find(c => mastered(c.words) < c.words.length) || CATS[0];
  app.innerHTML =
    '<div id="voiceNotice">' + voiceNoticeHTML() + '</div>' +
    '<section class="hero">' +
      '<h1>לומדים לשמוע ולדבר רוסית</h1>' +
      '<p>כל מילה עם הקראה בקול וכתיב בעברית — שומעים, חוזרים בקול, ומתרגלים. בלי אותיות רוסיות, בלי שיעורי דקדוק.</p>' +
      '<div class="hero-bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="hero-stats">' +
        '<span><b>' + done + '</b>מילים שאת/ה יודע/ת</span>' +
        '<span><b>' + inWork + '</b>בתרגול</span>' +
        '<span><b>' + TOTAL + '</b>בקורס</span>' +
      '</div>' +
      '<div class="row">' +
        '<button class="btn btn-lg hero-cta" data-go="quiz" data-cat="mix">🎧 תרגול מהיר</button>' +
        '<button class="btn btn-lg" style="background:rgba(255,255,255,.18);color:#fff" data-go="cat" data-cat="' + next.id + '">' + esc(next.icon) + ' ' + esc(next.title) + '</button>' +
      '</div>' +
    '</section>' +
    '<div class="section-head"><h2>השיעורים</h2><span class="hint">' + CATS.length + ' שיעורים · לפי סדר לימוד</span></div>' +
    '<div class="grid">' +
      CATS.map((c, i) => {
        const m = mastered(c.words), p = Math.round(m / c.words.length * 100);
        return '<button class="lesson" style="--h:' + c.h + '" data-go="cat" data-cat="' + c.id + '">' +
          '<div class="lesson-top"><span class="emoji">' + c.icon + '</span>' +
            '<span><span class="lesson-name">' + esc(c.title) + '</span>' +
            '<span class="lesson-sub">שיעור ' + (i + 1) + ' · ' + c.words.length + ' מילים</span></span></div>' +
          '<div class="lesson-blurb">' + esc(c.blurb) + '</div>' +
          '<div class="bar"><i style="width:' + p + '%"></i></div>' +
          (m === c.words.length
            ? '<span class="done-pill">✓ הושלם</span>'
            : '<span class="lesson-sub">' + m + ' מתוך ' + c.words.length + ' כבר יודעים</span>') +
        '</button>';
      }).join("") +
    '</div>' +
    installCardHTML() +
    '<p class="foot">גרסה 3 · ' + TOTAL + ' מילים · ההתקדמות נשמרת במכשיר הזה</p>';
}

function isInstalled() {
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function installCardHTML() {
  if (isInstalled()) return "";
  return '<div class="install-card">' +
    '<span class="t"><b>📱 להפוך את זה לאפליקציה</b>' +
    'מוסיפים אייקון למסך הבית — נפתח במסך מלא, בלי שורת כתובת, ועובד גם בלי אינטרנט.</span>' +
    '<button class="btn btn-brand" data-install="1">איך עושים את זה?</button></div>';
}

function screenCat() {
  const c = catById(state.catId), m = mastered(c.words);
  app.innerHTML =
    '<div class="crumbs"><button class="btn btn-ghost" data-go="home">← כל השיעורים</button></div>' +
    '<div style="--h:' + c.h + '">' +
      '<div class="head-card"><span class="emoji">' + c.icon + '</span>' +
        '<div><h1>' + esc(c.title) + '</h1><p>' + esc(c.blurb) + ' · ' + m + ' מתוך ' + c.words.length + ' כבר יודעים.</p></div></div>' +
      '<div class="mode-row">' +
        '<button class="mode" data-go="learn" data-cat="' + c.id + '"><span class="ic">🃏</span><span><strong>ללמוד את המילים</strong><span>כרטיסיות עם הקראה — אחת אחת</span></span></button>' +
        '<button class="mode" data-go="quiz" data-cat="' + c.id + '"><span class="ic">🎧</span><span><strong>תרגול האזנה</strong><span>10 שאלות קצרות</span></span></button>' +
      '</div>' +
      '<div class="section-head"><h2>כל המילים בשיעור</h2><span class="hint">לחיצה על הרמקול משמיעה</span></div>' +
      '<div class="word-list">' +
        c.words.map(w =>
          '<div class="word-row">' +
            '<span class="status ' + levelOf(w.id) + '" aria-hidden="true"></span>' +
            '<span class="he"><b>' + esc(w.he) + '</b>' + (w.note ? '<small>' + esc(w.note) + '</small>' : '') + '</span>' +
            '<span class="tr">' + esc(w.tr) + cyr(w) + '</span>' +
            '<button class="speak" data-say="' + esc(w.ru) + '" aria-label="השמע: ' + esc(w.he) + '">' + ICON + '</button>' +
          '</div>').join("") +
      '</div>' +
    '</div>';
}

function screenLearn() {
  const c = catById(state.catId), w = c.words[state.idx];
  app.innerHTML =
    '<div class="crumbs"><button class="btn btn-ghost" data-go="cat" data-cat="' + c.id + '">← ' + esc(c.title) + '</button></div>' +
    '<div class="stage" style="--h:' + c.h + '">' +
      '<span class="counter">כרטיסייה ' + (state.idx + 1) + ' מתוך ' + c.words.length + '</span>' +
      '<div class="card">' +
        '<button class="big-speak" data-say="' + esc(w.ru) + '" aria-label="השמע שוב">' + ICON + '</button>' +
        '<div class="translit">' + esc(w.tr) + '</div>' +
        (state.flipped
          ? '<div class="meaning">' + esc(w.he) + '</div>' + (prefs.cyr ? '<div class="cyr">' + esc(w.ru) + '</div>' : "") +
            (w.note ? '<p class="note">' + esc(w.note) + '</p>' : "")
          : '<p class="veil">תשמעי, תגידי בקול — ואז גלי את המשמעות</p>') +
      '</div>' +
      '<div class="row">' +
        (state.flipped
          ? '<button class="btn btn-lg" data-learn="again">עוד לא 🙂</button><button class="btn btn-lg btn-c" data-learn="known">ידעתי ✓</button>'
          : '<button class="btn btn-lg btn-c" data-learn="flip">גלי את המשמעות</button>') +
      '</div>' +
      '<div class="row">' +
        '<button class="btn btn-ghost" data-learn="prev"' + (state.idx === 0 ? " disabled" : "") + '>הקודם</button>' +
        '<button class="btn btn-ghost" data-learn="next">הבא ←</button>' +
      '</div>' +
    '</div>';
  if (!state.flipped) setTimeout(() => speak(w.ru), 220);
}

function buildQuiz(catId) {
  let pool;
  if (catId === "mix") {
    const weak = ALL.filter(w => scoreOf(w.id) > 0 && scoreOf(w.id) < MASTER_AT);
    const fresh = ALL.filter(w => scoreOf(w.id) === 0);
    pool = shuffle(weak).slice(0, 6).concat(shuffle(fresh).slice(0, 8));
    if (pool.length < 10) pool = pool.concat(shuffle(ALL).slice(0, 10));
  } else pool = shuffle(catById(catId).words);
  const picks = shuffle(pool).slice(0, 10);
  return {
    catId,
    h: catId === "mix" ? 248 : catById(catId).h,
    qs: picks.map((w, i) => {
      const sameCat = ALL.filter(x => x.cat === w.cat && x.id !== w.id);
      const others = shuffle(sameCat.length >= 3 ? sameCat : ALL.filter(x => x.id !== w.id)).slice(0, 3);
      return { word: w, type: i % 3 === 2 ? "recall" : "listen", options: shuffle([w].concat(others)) };
    }),
    i: 0, right: 0, answered: null, wrongList: []
  };
}

function screenQuiz() {
  const q = state.quiz, cur = q.qs[q.i], w = cur.word;
  const pct = Math.round(q.i / q.qs.length * 100);
  app.innerHTML =
    '<div class="crumbs">' +
      (q.catId === "mix"
        ? '<button class="btn btn-ghost" data-go="home">← כל השיעורים</button>'
        : '<button class="btn btn-ghost" data-go="cat" data-cat="' + q.catId + '">← ' + esc(catById(q.catId).title) + '</button>') +
    '</div>' +
    '<div class="stage" style="--h:' + q.h + '">' +
      '<div class="quiz-head">' +
        '<span class="counter">' + (q.i + 1) + '/' + q.qs.length + '</span>' +
        '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
        '<span class="hearts">✓ ' + q.right + '</span>' +
      '</div>' +
      '<div class="prompt">' +
        (cur.type === "listen"
          ? '<p class="ask">מה שמעת?</p><button class="big-speak" data-say="' + esc(w.ru) + '" aria-label="השמע שוב">' + ICON + '</button><p class="ask">לחיצה = להשמיע שוב</p>'
          : '<p class="ask">איך אומרים ברוסית?</p><div class="he-word">' + esc(w.he) + '</div>') +
      '</div>' +
      '<div class="options">' +
        cur.options.map((o, n) =>
          '<button class="opt" data-ans="' + o.id + '"><span class="num">' + (n + 1) + '</span>' +
            '<span>' + (cur.type === "listen" ? esc(o.he) : esc(o.tr) + cyr(o)) + '</span></button>').join("") +
      '</div>' +
      '<div id="fb" aria-live="polite"></div>' +
    '</div>';
  if (cur.type === "listen") setTimeout(() => speak(w.ru), 260);
}

function answer(id) {
  const q = state.quiz, cur = q.qs[q.i], w = cur.word;
  if (q.answered) return;
  q.answered = id;
  const right = id === w.id;
  bump(w.id, right);
  if (right) q.right++; else q.wrongList.push(w);
  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.ans === w.id) { b.classList.add("correct"); b.querySelector(".num").textContent = "✓"; }
    else if (b.dataset.ans === id) { b.classList.add("wrong"); b.querySelector(".num").textContent = "✕"; }
  });
  speak(w.ru);
  const last = q.i === q.qs.length - 1;
  document.getElementById("fb").innerHTML =
    '<div class="feedback ' + (right ? "ok" : "no") + '">' +
      '<span class="txt">' + (right ? "יפה מאוד! " : "כמעט — ") + '<b>' + esc(w.tr) + '</b> = ' + esc(w.he) + '</span>' +
      '<button class="btn" data-next="1">' + (last ? "סיום" : "הבא ←") + '</button>' +
    '</div>';
  document.querySelector("[data-next]").focus();
}

function screenResult() {
  const q = state.quiz, pct = q.right / q.qs.length;
  const stars = pct >= 0.9 ? "★★★" : pct >= 0.6 ? "★★☆" : "★☆☆";
  const title = pct >= 0.9 ? "מעולה! זה כבר נשמע כמו רוסית" : pct >= 0.6 ? "יפה מאוד, ממשיכים" : "ככה בדיוק לומדים";
  app.innerHTML =
    '<div class="stage" style="--h:' + q.h + '">' +
      '<div class="result">' +
        '<div class="stars">' + stars + '</div>' +
        '<div class="score">' + q.right + '/' + q.qs.length + '</div>' +
        '<h2>' + title + '</h2>' +
        (q.wrongList.length
          ? '<div class="review">' + q.wrongList.map(w =>
              '<div class="r-row"><button class="speak" data-say="' + esc(w.ru) + '" aria-label="השמע">' + ICON + '</button>' +
              '<span><b>' + esc(w.tr) + '</b> <span class="g">— ' + esc(w.he) + '</span></span></div>').join("") + '</div>'
          : '<p class="note">בלי טעויות בכלל! אפשר לעבור לשיעור הבא.</p>') +
        '<div class="row">' +
          '<button class="btn btn-lg btn-c" data-go="quiz" data-cat="' + q.catId + '">עוד סיבוב 🔁</button>' +
          '<button class="btn btn-lg" data-go="home">כל השיעורים</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function render() {
  renderMini();
  ({ home: screenHome, cat: screenCat, learn: screenLearn, quiz: screenQuiz, result: screenResult }[state.screen])();
}

/* =======================  אירועים  ======================= */
document.addEventListener("click", e => {
  const say = e.target.closest("[data-say]");
  if (say) { speak(say.dataset.say, say); return; }

  const nav = e.target.closest("[data-go]");
  if (nav) {
    const to = nav.dataset.go, cat = nav.dataset.cat;
    if (to === "home") go("home", { catId: null });
    else if (to === "cat") go("cat", { catId: cat });
    else if (to === "learn") go("learn", { catId: cat, idx: 0, flipped: false });
    else if (to === "quiz") go("quiz", { quiz: buildQuiz(cat) });
    return;
  }

  const ans = e.target.closest("[data-ans]");
  if (ans) { answer(ans.dataset.ans); return; }

  if (e.target.closest("[data-next]")) {
    const q = state.quiz;
    if (q.i === q.qs.length - 1) go("result");
    else { q.i++; q.answered = null; render(); }
    return;
  }

  const lb = e.target.closest("[data-learn]");
  if (lb) {
    const c = catById(state.catId), w = c.words[state.idx], act = lb.dataset.learn;
    if (act === "flip") { state.flipped = true; render(); }
    else if (act === "known" || act === "again") {
      setKnown(w.id, act === "known");
      if (state.idx === c.words.length - 1) go("cat", { catId: c.id });
      else { state.idx++; state.flipped = false; render(); }
    } else if (act === "next") {
      if (state.idx === c.words.length - 1) go("cat", { catId: c.id });
      else { state.idx++; state.flipped = false; render(); }
    } else if (act === "prev" && state.idx > 0) { state.idx--; state.flipped = false; render(); }
    return;
  }

  if (e.target.closest("[data-install]")) {
    if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(() => { deferredPrompt = null; }); }
    else alert("בכרום באנדרואיד:\n\n1. לוחצים על שלוש הנקודות ⋮ למעלה\n2. בוחרים \"הוספה למסך הבית\"\n3. מאשרים \"התקנה\"\n\nבאייפון (ספארי):\n1. לוחצים על כפתור השיתוף למטה\n2. בוחרים \"הוסף למסך הבית\"");
    return;
  }

  const chip = e.target.closest(".chip");
  if (chip) {
    if (chip.dataset.size) prefs.size = +chip.dataset.size;
    if (chip.dataset.rate) { prefs.rate = +chip.dataset.rate; speak("Привет"); }
    if (chip.dataset.cyr) { prefs.cyr = +chip.dataset.cyr; render(); }
    if (chip.dataset.cyr === "0") { prefs.cyr = 0; render(); }
    savePrefs();
  }
});

document.getElementById("setBtn").addEventListener("click", e => {
  const panel = document.getElementById("settings");
  const open = panel.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", String(open));
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("לאפס את כל ההתקדמות ולהתחיל מחדש?")) return;
  progress = {};
  saveProgress();
  render();
});

document.addEventListener("keydown", e => {
  if (state.screen === "learn") {
    if (e.key === " ") { e.preventDefault(); if (!state.flipped) { state.flipped = true; render(); } }
    if (e.key === "ArrowLeft") document.querySelector('[data-learn="next"]')?.click();
    if (e.key === "ArrowRight") document.querySelector('[data-learn="prev"]')?.click();
  }
  if (state.screen === "quiz" && /^[1-4]$/.test(e.key)) document.querySelectorAll(".opt")[+e.key - 1]?.click();
  if (e.key === "Enter") document.querySelector("[data-next]")?.click();
});

/* =======================  התקנה + אופליין  ======================= */
let deferredPrompt = null;
const bar = document.getElementById("installBar");
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e;
  if (!localStorage.getItem("ru-install-dismissed")) bar.classList.add("show");
});
document.getElementById("installBtn").addEventListener("click", async () => {
  bar.classList.remove("show");
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null;
});
document.getElementById("installNo").addEventListener("click", () => {
  bar.classList.remove("show");
  try { localStorage.setItem("ru-install-dismissed", "1"); } catch (e) {}
});
window.addEventListener("appinstalled", () => bar.classList.remove("show"));
if ("serviceWorker" in navigator) {
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(reg => reg.update().catch(() => {}))
      .catch(() => {});
  });
}

applyPrefs();
render();
</script>
